<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Sellqo - Jouw webshop. Simpel online. Start vandaag nog met verkopen." />
    <meta name="author" content="Sellqo" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="fRIdk2cbm4poeB9XiUmwEsbIB_vqJW9DwFXTI_lsCaA" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sellqo" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:title" content="Sellqo - Jouw webshop. Simpel online." />

    <meta property="og:url" content="https://sellqo.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Sellqo" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1E3A5F" />

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sellqo",
        "url": "https://sellqo.app",
        "logo": "https://sellqo.app/web-app-manifest-512x512.png",
        "sameAs": ["https://sellqo.app"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sellqo",
        "url": "https://sellqo.app"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
