name: CI

# Draait op elke push naar main en op elke pull request. De drie checks staan
# als losse steps zodat in GitHub direct zichtbaar is welke faalt.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, i18n-pariteit, capacitor-sync, skills-sync, deno check en build
    runs-on: ubuntu-latest

    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      # De versie komt uit .nvmrc, zodat lokaal en CI niet uit elkaar kunnen
      # lopen. Wie de versie wil wijzigen, past .nvmrc aan en niets anders.
      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Bun is geen keuze maar een vereiste: het prebuild-script van dit project
      # draait `bunx tsx scripts/generate-sitemap.ts`, dus zonder bun faalt de
      # build. bun.lock is de actuele lockfile van de repo.
      - name: Bun opzetten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Dependencies installeren
        run: bun install

      # 1. Typecheck. Vangt fouten die de build mist: `vite build` gebruikt
      #    esbuild, dat types stript en geen scope-analyse doet. In batch 3a
      #    liet dat zeventien `t()`-buiten-componentscope-fouten door een groene
      #    build glippen; die waren als runtime-crash geland.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      # 2. Lint, tegen een baseline. Een kale `eslint .` is meteen rood — er staan
      #    1.300+ bestaande no-explicit-any-fouten in de repo en die zijn geen
      #    lintstap maar een refactor. Het script kent daarom twee niveaus: een
      #    handvol regels met nultolerantie (react-hooks/rules-of-hooks voorop),
      #    en daarnaast een totaal dat niet mag stijgen. Zakt het totaal, dan
      #    meldt het script dat en kan de lat omlaag met --update.
      #    Aanleiding: op 10 sep stonden er negen rules-of-hooks-schendingen in,
      #    waarvan BolActionsCard het orderscherm kon laten crashen. Zonder
      #    lintstap viel daar niets van om.
      - name: Lint
        run: node scripts/verify-lint-baseline.mjs

      # INVOICE-INTEGRITY-1: gerichte vitest-run. De volledige suite draait (nog) niet in CI;
      # deze tests bewaken creditnota-bedragen en de pariteit van de meldingsdefaults (die
      # brak op 27-10 ongemerkt door een e-maildefault).
      - name: Vitest (creditnota's, meldingsdefaults, platformcijfers, sporen, kassa-betalen)
        run: npx vitest run src/lib/creditNoteLines.test.ts src/test/notificationDefaults.test.ts src/lib/platformBillingOverview.test.ts src/test/tracks.test.ts src/kassa/app/__tests__/pay.test.ts src/kassa/app/__tests__/payDialog.test.tsx src/kassa/app/__tests__/paySettings.test.tsx src/kassa/app/__tests__/requests.test.tsx

      # 3. i18n-pariteit. Het script eindigt met exit 1 zodra één taal een key
      #    mist, waardoor deze step vanzelf rood wordt.
      - name: i18n-pariteit
        run: node scripts/i18n-parity.mjs

      # I18N-FIX-1: keys die de code opvraagt maar die nergens bestaan (toonden
      # "import.drop_or_click" in de productimport). Pariteit ziet dat niet.
      - name: Gebruikte vertaalkeys
        run: node scripts/check-i18n-used-keys.mjs

      # MAIL-SENDER-1: op sellqo.app bestaat alleen info@; winkels gebruiken
      # <prefix>@mail.sellqo.app. Faalt op elk ander @sellqo.app-adres.
      - name: Mailadressen (alleen info@sellqo.app en *@mail.sellqo.app)
        run: node scripts/check-mail-addresses.mjs

      # MSG-STATUS-FIX: schrijfacties naar customer_messages volgen het schema
      # (geen hernoemde kolom `status`, delivery_status binnen de constraint).
      - name: customer_messages-writes
        run: node scripts/check-customer-messages-writes.mjs

      # NOTIF-SOURCES-1: meldingsbronnen gebruiken de echte parameters van
      # send_notification, snake_case naar create-notification, en een categorie
      # die in de enum staat. Drie bronnen faalden daar maandenlang stil op.
      - name: Meldingsbronnen
        run: node scripts/check-notification-sources.mjs

      # APP-CLEAN-2: knoppen en menu-items zonder werking. Op 12-10-2026 vond een
      # sweep er 30 (18 op de bol-detailpagina) plus een kassaknop die een nep-
      # kaartbetaling registreerde. Baseline per bestand; elke nieuwe dode knop faalt.
      - name: Knoppen zonder werking
        run: node scripts/check-dead-buttons.mjs

      # EDGE-PIN-1: op 15-10-2026 faalde elke edge-deploy omdat esm.sh een verse
      # supabase-js-release (@2 → 2.118.0) nog niet volledig gebouwd had. Elke
      # supabase-js-import onder supabase/functions heeft daarom een volledige
      # x.y.z-versie. Andere remote imports zonder patchversie worden gemeld, niet geblokkeerd.
      - name: Edge functions (supabase-js vast gepind)
        run: node scripts/verify-edge-pins.mjs

      # 4. Capacitor-pariteit. De native manifesten (twee gradle-bestanden en de
      #    Podfile) zijn gegenereerd en worden alleen bijgewerkt als iemand
      #    `npx cap sync` draait en de uitkomst commit. Voor Android gebeurde dat
      #    een maand lang niet zonder dat iets omviel — vandaar deze step.
      - name: Capacitor-sync
        run: node scripts/verify-capacitor-sync.mjs

      # 5. Skill-pariteit. Dezelfde skill leeft in .claude/skills (bron), in
      #    .agents/skills (spiegel) en als workspace-skill aan de Lovable-kant.
      #    Niets hield ze gelijk: op 10 sep was de workspace-kopie van
      #    sellqo-i18n-verplicht bijna half zo groot als de repo-versie en miste
      #    de codemod-motor. Deze step dekt de twee kopieën die in git leven; de
      #    workspace-kant kan een runner niet bereiken (die zit achter de
      #    connector) en staat als handmatige stap in het script beschreven.
      - name: Skills-sync
        run: node scripts/verify-skills-sync.mjs

      # 6. Edge functions typechecken. De Supabase-deploy checkt geen types,
      #    dus niets hield ze tegen: op 29 sep 2026 gaf `deno check` 207 fouten
      #    in 32 bestanden, waaronder vijf functies die al sinds mei/juni bij
      #    élke aanroep faalden (tenant_id vóór de declaratie, een dubbele
      #    `const auth`). De Lovable-agent repareerde er intussen op eigen
      #    houtje een paar tijdens een deploy. `--node-modules-dir=none`: anders
      #    zoekt deno `npm:`-imports in de node_modules van de webapp en breekt
      #    hij af. `--no-lock`: de functies hebben geen gedeelde lockfile.
      - name: Deno opzetten
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      # UNIFIED-MAIL-1: DENO_NO_PACKAGE_JSON — anders leest deno de package.json van
      # de webapp mee, en faalt de stap zodra een (dev)dependency daar jonger is dan
      # 24 uur (deno's minimum-dependency-age). De functies gebruiken die package.json
      # niet: alleen URL- en npm:-imports.
      - name: Edge functions (deno check)
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts

      # PROMO-ENGINE-1: de promotiemotor bepaalt wat klanten betalen. Unit tests zonder
      # netwerk; een rode test houdt een verkeerde kortingsberekening tegen.
      - name: Edge functions (deno test promotiemotor, catalogusfilters en social-publicatie)
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno test --no-lock --node-modules-dir=none supabase/functions/_shared/promotionEngine.test.ts supabase/functions/_shared/catalogFilters.test.ts supabase/functions/_shared/fulfillmentSlots.test.ts supabase/functions/_shared/productAddons.test.ts supabase/functions/_shared/socialPublish.test.ts supabase/functions/_shared/socialMedia.test.ts supabase/functions/_shared/socialRunner.test.ts supabase/functions/_shared/socialInsights.test.ts supabase/functions/_shared/inviteRoles.test.ts supabase/functions/_shared/planLifecycle.test.ts supabase/functions/_shared/addonBilling.test.ts supabase/functions/_shared/pdfText.test.ts supabase/functions/_shared/sizeChart.test.ts supabase/functions/_shared/diningTables.test.ts supabase/functions/_shared/cloudprnt.test.ts supabase/functions/_shared/storefrontErrorStatus.test.ts supabase/functions/_shared/odooPartnerType.test.ts supabase/functions/_shared/watchtowerHealth.test.ts supabase/functions/_shared/billingAlerts.test.ts supabase/functions/_shared/invoiceBuild.test.ts supabase/functions/_shared/peppol/ubl-builder.test.ts supabase/functions/_shared/odooBooking.test.ts

      # SEC-DOMAIN-2: de echte storefront-resolve-handler tegen een nep-databank (netwerkloos).
      # SUB-UNIFY-2A: idem voor subscription-lifecycle-sweep (dry-run schrijft niets).
      # EVENT-409-1: storefront-api (409 bij volzet) en send-ticket-confirmation (ORDER_CLOSED).
      # BILLING-SAFE-1: webhook-afboeking en mislukte afschrijving (claim, herpoging, bundel).
      # INVOICE-INTEGRITY-1: echte generate-invoice-handler (korting als regel, pdf/CII/UBL kloppen).
      # ODOO-GUARD-1: echte sync-odoo-invoices tegen een nagebootste Odoo (exact, concept bij verschil).
      # PAYOUT-LINK-1: Stripe-uitbetaling → factuur → Odoo-notitie (eenmalig, Referentie aangevuld).
      - name: Edge functions (test storefront-resolve en lifecycle-sweep)
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno test --allow-env --no-lock --node-modules-dir=none --import-map=scripts/promo-compare/import_map.resolve.json scripts/promo-compare/resolve.test.ts scripts/promo-compare/lifecycle-sweep.test.ts scripts/promo-compare/addon-lines.test.ts scripts/promo-compare/event409.test.ts scripts/promo-compare/tableRequest.test.ts scripts/promo-compare/ticketResend.test.ts scripts/promo-compare/billingSafe.test.ts scripts/promo-compare/generateInvoice.test.ts scripts/promo-compare/odooSync.test.ts scripts/promo-compare/payoutLink.test.ts scripts/promo-compare/billingLock.test.ts scripts/promo-compare/supplierInvoices.test.ts scripts/promo-compare/supplierInbox.test.ts

      # R10 (CATALOG-FILTERS-1b): rooktest van de echte storefront-api-functies tegen een
      # thenable nep-databank. Vangt o.a. `await` op een querybuilder, wat deno check mist.
      - name: Edge functions (rooktest storefront-api)
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          cp supabase/functions/storefront-api/index.ts supabase/functions/storefront-api/__smoke.ts
          echo 'export { getProducts, getProductFilters, computeCartTotals, cartAddItem, cartUpdateItem, cartRemoveItem, cartApplyDiscount, cartRemoveDiscount, getFulfillmentSlots, validateCartFulfillment, payOnPickupMethod, checkoutTable, fulfillmentAvailability, foodInfo, ticketFeeFor, orderOverageFeeCents, resolveEventPrice, earlyBirdForType, seatPublicStatus, validateDiscountCode, appliedCodesOnly, resolveDomain, getSeo, getSitemapData, isSoldOutToday, channelAllows, cartAvailabilityError, cartRestore, cartGet, getCartForCheckout, checkoutComplete, checkoutVerifyPayment };' >> supabase/functions/storefront-api/__smoke.ts
          deno run --allow-read --allow-env --allow-net --no-lock --node-modules-dir=none --import-map=scripts/promo-compare/import_map.smoke.json scripts/promo-compare/smoke.ts
          rm supabase/functions/storefront-api/__smoke.ts

      # 7. Productiebuild. Draait via npm omdat het prebuild-script daaraan
      #    hangt; npm staat standaard op de runner naast de bun-installatie.
      - name: Build
        run: npm run build
